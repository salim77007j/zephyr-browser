name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit tests + filter engine check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: Run tests
        run: cargo test --verbose
      - name: Filter engine spot check
        run: cargo run --release -- --filter-check

  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build release
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/zephyr dist/
          cp README.md dist/
          tar czf zephyr-linux-x64.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/zephyr.exe dist/
          # include any produced runtime DLLs (e.g. WebView2Loader) if present
          if (Test-Path target/release/*.dll) { Copy-Item target/release/*.dll dist/ }
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath zephyr-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-${{ runner.os }}
          path: |
            zephyr-linux-x64.tar.gz
            zephyr-windows-x64.zip
          if-no-files-found: error

  smoke:
    name: Headless functional smoke test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zephyr-Linux

      - name: Unpack binary
        run: |
          tar xzf zephyr-linux-x64.tar.gz
          chmod +x zephyr

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 xvfb imagemagick fonts-dejavu-core
          ./zephyr --version

      - name: Run smoke test
        run: bash scripts/ci-smoke.sh ./zephyr smoke-artifacts

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-artifacts/
          if-no-files-found: warn

  release:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zephyr-Linux
      - uses: actions/download-artifact@v4
        with:
          name: zephyr-Windows
      - uses: actions/download-artifact@v4
        with:
          name: smoke-results
      - name: Stage files
        run: |
          mkdir -p release
          mv zephyr-linux-x64.tar.gz zephyr-windows-x64.zip release/ 2>/dev/null || true
          cp smoke-artifacts/*.png release/ 2>/dev/null || true
          cp smoke-artifacts/smoke-report.json release/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
