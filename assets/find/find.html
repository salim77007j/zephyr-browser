<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find</title>
<link rel="stylesheet" href="find.css">
</head>
<body>
<div id="findbar">
  <input id="find-input" spellcheck="false" autocomplete="off" placeholder="Find in page" aria-label="Find in page">
  <span id="find-count">–</span>
  <button id="find-prev" class="fbtn" title="Previous match (Shift+Enter)" aria-label="Previous"></button>
  <button id="find-next" class="fbtn" title="Next match (Enter)" aria-label="Next"></button>
  <span class="fsep"></span>
  <button id="find-close" class="fbtn" title="Close (Esc)" aria-label="Close"></button>
</div>
<script src="find.js"></script>
</body>
</html>
