<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zephyr</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="chrome" data-theme="light" data-platform="any">
  <!-- ================= tab strip ================= -->
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" class="strip-btn" title="New tab (Ctrl+T)" aria-label="New tab"></button>
    <div id="drag-strip"></div>
    <div id="win-controls" class="hidden">
      <button id="win-min" class="win-btn" title="Minimize" aria-label="Minimize"></button>
      <button id="win-max" class="win-btn" title="Maximize" aria-label="Maximize"></button>
      <button id="win-close" class="win-btn close" title="Close" aria-label="Close"></button>
    </div>
  </div>

  <!-- ================= toolbar ================= -->
  <div id="toolbar">
    <button id="nav-back" class="tb icon nav" title="Back (Alt+Left)" aria-label="Back"></button>
    <button id="nav-fwd" class="tb icon nav" title="Forward (Alt+Right)" aria-label="Forward"></button>
    <button id="nav-reload" class="tb icon nav" title="Reload (Ctrl+R)" aria-label="Reload"></button>
    <button id="nav-home" class="tb icon nav" title="Home" aria-label="Home"></button>

    <div id="omnibox">
      <span id="sec-icon" class="sec" title="Site information"></span>
      <input id="url-input" spellcheck="false" autocomplete="off"
             placeholder="Search Google or type a URL" aria-label="Search and address bar">
      <button id="bm-star" class="tb mini" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark"></button>
    </div>

    <button id="dl-btn" class="tb icon hidden" title="Downloads (Ctrl+J)" aria-label="Downloads"></button>
    <button id="ext-btn" class="tb icon" title="Protection" aria-label="Protection and privacy"><span id="ext-badge" class="tb-badge hidden"></span></button>
    <button id="profile-btn" class="tb icon profile" title="Profile" aria-label="Profile"></button>
    <button id="menu-btn" class="tb icon" title="Customize and control Zephyr" aria-label="Menu"></button>
  </div>

  <!-- ================= bookmarks bar ================= -->
  <div id="bookmarksbar" class="hidden"></div>

  <!-- ================= omnibox inline site info (tiny hint line) ================= -->
  <div id="kbd-hint" class="hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
